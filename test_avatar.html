<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<title>ප්‍රකෘති — Sketch Face Test v12 (Layered)</title>
<style>
body{font-family:'Iskoola Pota','Noto Sans Sinhala',sans-serif;background:#0f1f16;color:#e8f5ee;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding:24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#9fc7b2;font-size:13px;margin-bottom:18px}
canvas{border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);background:#efe9df;max-width:90vw;height:auto}
.btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:#2e7d50;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
button:hover{background:#39985f}
input[type=text]{width:min(460px,92vw);padding:10px 14px;border-radius:10px;border:1px solid #2c4a38;
  background:#16281e;color:#e8f5ee;font-size:15px;font-family:inherit;margin-top:14px;text-align:center}
.msg{color:#ffd479;font-size:14px;margin-top:12px;min-height:20px;text-align:center}
.note{color:#7fae95;font-size:12px;max-width:660px;line-height:1.9;margin-top:12px;text-align:center}
</style>
</head>
<body>
<h1>🎭 ප්‍රකෘති — Sketch Face Test Lab v12 (Layered)</h1>
<p class="sub">app එකට සම්බන්ධ නෑ — local test එකක් 🧪</p>
<canvas id="cv" width="420" height="420"></canvas>

<div class="btns">
  <button id="blinkBtn">👁 ඇහිලුම</button>
  <button id="aBtn">🗣️ "අ"</button>
  <button id="oBtn">🗣️ "ඔ"</button>
  <button id="iBtn">🗣️ "ඉ"</button>
  <button id="speakBtn">🗣️ කතා කරන්න</button>
</div>
<input type="text" id="txt" value="සුබ ආරංචියක්! අද වැඩ ඔක්කොම සාර්ථකයි.">
<div class="msg" id="msg"></div>
<p class="note">
  <b>v12 — Layered swap:</b> ඔයාගේම sketch එකේ කට shapes (mouth_a/o/i.png) කෙලින්ම
  මාරු වෙනවා — classic 2D animation විදියටම. ඇස් blink eyelid එකෙන්ම.
  Buttons 3 ඔබලා එක එක shape බලන්න, ඊට පස්සේ කතා කරවලා බලන්න.
</p>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), msg=document.getElementById('msg');
const BLINK_MS=150;

/* ---------- images ---------- */
const files={ closed:'face_base.png', A:'mouth_a.png', O:'mouth_o.png', E:'mouth_i.png' };
const imgs={}; let loaded=0; const failed=[];
Object.keys(files).forEach(k=>{
  const im=new Image(); im.src=files[k]; imgs[k]=im;
  im.onload=()=>{ loaded++; done(); };
  im.onerror=()=>{ failed.push(files[k]); done(); };
});
function done(){
  if(loaded+failed.length===4){
    msg.textContent = failed.length ? ('⚠️ නැති files: '+failed.join(', ')) : '✅ images 4ම load වුනා';
  }
}

/* ---------- eyes calibration (saved earlier) ---------- */
let eyes={l:{x:.5857,y:.5452}, r:{x:.3429,y:.5500}, w:.15057};
let lidColor='#f0eae0';
try{ const e=JSON.parse(localStorage.getItem('pk_eyes')||'null'); if(e) eyes=e; }catch(e){}
try{ const c=JSON.parse(localStorage.getItem('pk_lid')||'null'); if(c) lidColor=c; }catch(e){}

/* ---------- blink ---------- */
let blinkUntil=0;
(function sb(){ setTimeout(()=>{ blinkUntil=performance.now()+BLINK_MS; sb(); },2600+Math.random()*3400); })();
document.getElementById('blinkBtn').onclick=()=>{ blinkUntil=performance.now()+BLINK_MS; };

/* ---------- visemes ---------- */
function visemeFor(ch){
  if(ch===' '||'.,!?;:—'.indexOf(ch)>=0) return 'closed';
  ch=ch.toUpperCase();
  if('අආඇඈාැඓA'.indexOf(ch)>=0) return 'A';
  if('ඔඕඋඌූොෝෞOUW'.indexOf(ch)>=0) return 'O';
  if('ඉඊිීඑඒෙේෛEIY'.indexOf(ch)>=0) return 'E';
  return 'M';
}

/* ---------- speaking (rhythm + holds) ---------- */
let speak={active:false,viseme:'closed',timer:null};
function jit(v){ return v*(0.85+Math.random()*0.3); }
function speakText(text){
  if(!text) return;
  clearTimeout(speak.timer);
  const chars=text.split(''); let i=0; speak.active=true;
  const step=()=>{
    if(i>=chars.length){ speak.active=false; speak.viseme='closed'; msg.textContent='✅ කතාව ඉවරයි'; return; }
    const ch=chars[i++];
    speak.viseme=visemeFor(ch);
    let d;
    if(speak.viseme==='closed'){ d=('.,!?;:—'.indexOf(ch)>=0)?200+Math.random()*80:80+Math.random()*40; }
    else if(speak.viseme==='M'){ d=95+Math.random()*30; }
    else { d=150+Math.random()*60; }
    speak.timer=setTimeout(step,d);
  };
  step();
}
document.getElementById('speakBtn').onclick=()=>speakText(document.getElementById('txt').value);

/* single-shape preview buttons */
let holdViseme=null, holdUntil=0;
function hold(v){ holdViseme=v; holdUntil=performance.now()+900; }
document.getElementById('aBtn').onclick=()=>hold('A');
document.getElementById('oBtn').onclick=()=>hold('O');
document.getElementById('iBtn').onclick=()=>hold('E');

/* ---------- eyelid ---------- */
function drawLid(cx,cy,faceW){
  const w=eyes.w*faceW, h=w*0.42;
  ctx.fillStyle=lidColor;
  ctx.beginPath(); ctx.ellipse(cx,cy,w/2,h/1.5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(70,60,52,0.5)'; ctx.lineWidth=Math.max(1.2,h*0.12);
  ctx.beginPath(); ctx.moveTo(cx-w/2.6,cy+h*0.05);
  ctx.quadraticCurveTo(cx,cy+h*0.4,cx+w/2.6,cy+h*0.05); ctx.stroke();
}

/* ---------- loop ---------- */

/* watermark cover (Gemini mark, bottom-right) */
function coverWatermark(g){
  const px=g.ox+g.dw*0.845, py=g.oy+g.dh*0.855;
  const pw=g.dw*0.17, ph=g.dh*0.17;
  const cx=px+pw*0.5, cy=py+ph*0.5;
  const rad=ctx.createRadialGradient(cx,cy,pw*0.15,cx,cy,pw*0.8);
  rad.addColorStop(0,'rgba(234,231,226,1)');
  rad.addColorStop(0.75,'rgba(234,231,226,0.95)');
  rad.addColorStop(1,'rgba(234,231,226,0)');
  ctx.fillStyle=rad;
  ctx.fillRect(px-3,py-3,pw+8,ph+8);
}

let geo=null;
function loop(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(loaded===4&&failed.length===0){
    /* geometry — face_base එකෙන් එක වරක් විතරයි (හැම image එකකටම එකම rect) */
    if(!geo){
      const b=imgs.closed;
      const s=Math.min(cv.width/b.width,cv.height/b.height);
      geo={dw:b.width*s, dh:b.height*s};
      geo.ox=(cv.width-geo.dw)/2; geo.oy=(cv.height-geo.dh)/2;
    }
    let v=speak.viseme;
    if(!speak.active&&performance.now()<holdUntil) v=holdViseme;
    const key=(v==='A'||v==='O'||v==='E')?v:'closed';
    const im=imgs[key];

    /* breathing + head bob */
    const acting=speak.active;
    const bobX=acting?Math.sin(t/470)*0.9:0;
    const bobY=acting?Math.sin(t/320)*1.1:0;
    const br=1+0.012*Math.sin(t/750);
    ctx.save();
    ctx.translate(cv.width/2+bobX,geo.oy+geo.dh+bobY);
    ctx.scale(br,br);
    ctx.translate(-cv.width/2,-(geo.oy+geo.dh));
    /* layered swap — හැම image එකකුත් එකම rect එකට */
    ctx.drawImage(im,geo.ox,geo.oy,geo.dw,geo.dh);
        coverWatermark(geo);
    if(performance.now()<blinkUntil){
      drawLid(geo.ox+eyes.l.x*geo.dw, geo.oy+eyes.l.y*geo.dh, geo.dw);
      drawLid(geo.ox+eyes.r.x*geo.dw, geo.oy+eyes.r.y*geo.dh, geo.dw);
    }
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
